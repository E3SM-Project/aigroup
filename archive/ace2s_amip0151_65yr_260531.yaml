      - '1956-01-01T00:00:00'
      - '1961-01-01T00:00:00'
      - '1963-06-01T00:00:00'
      - '1966-01-01T00:00:00'
      - '1971-01-01T00:00:00'
      - '1973-06-01T00:00:00'
      - '1976-01-01T00:00:00'
      - '1981-01-01T00:00:00'
      - '1983-06-01T00:00:00'
      - '1986-01-01T00:00:00'
      - '1991-01-01T00:00:00'
      - '1993-06-01T00:00:00'
      - '1996-01-01T00:00:00'
      - '2001-01-01T00:00:00'
      - '2006-01-01T00:00:00'
    dataset:
      data_path: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/traindata/
    num_data_workers: 0
  aggregator:
    log_histograms: true
    time_mean_reference_data: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/e3sm-amip151-stats/amip151_1951_2015/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: amip151_ace2
  entity: e3smai
train_loader:
  batch_size: 16
  num_data_workers: 1
  dataset:
      data_path: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/traindata/
validation_loader:
  batch_size: 16
  num_data_workers: 16
  dataset:
    data_path: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/traindata/
    subset:
      start_time: '1996-01-01'
      stop_time: '2000-12-31'
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  kwargs:
    weight_decay: 0.01
  use_gradient_accumulation: true
stepper_training:
  n_ensemble: 2
  n_forward_steps:
    outcomes:
    - steps: 1
      probability: 0.6
    - steps: 2
      probability: 0.2
    - steps: 4
      probability: 0.1
    - steps: 12
      probability: 0.05
    - steps: 20
      probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    weights:
      T_0: 0.5
      T_1: 0.5
      U_0: 0.5
      V_0: 0.5
      specific_total_water_0: 0.5
      specific_total_water_1: 0.25
      specific_total_water_2: 0.5
      surface_precipitation_rate: 0.5
      FLDS: 2
      surface_upward_longwave_flux: 5
      surface_upward_shortwave_flux: 2
      FSDS: 2
      top_of_atmos_upward_shortwave_flux: 2
      tendency_of_total_water_path_due_to_advection: 0.5
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 384
          noise_embed_dim: 64
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
      normalization:
        network:
          global_means_path: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/e3sm-amip151-stats/amip151_1951_2015/centering.nc
          global_stds_path: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/e3sm-amip151-stats/amip151_1951_2015/scaling-full-field.nc
        residual:
          global_means_path: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/e3sm-amip151-stats/amip151_1951_2015/centering.nc
          global_stds_path: /pscratch/sd/i/imanick/E3SM_data/data_processing/output/amip/amip_151/e3sm-amip151-stats/amip151_1951_2015/scaling-residual.nc
      ocean:
        surface_temperature_name: TS
        ocean_fraction_name: OCNFRAC
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
