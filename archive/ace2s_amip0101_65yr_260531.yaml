# arg: --dataset andrep/2025-09-16-X-SHiELD-AMIP-1deg-8layer-11yr-stats:/statsdata
experiment_dir: /output
save_checkpoint: true
checkpoint_save_epochs:
  step: 1
validate_using_ema: true
max_epochs: 200
ema:
  decay: 0.999
inference:
  n_forward_steps: 7330
  forward_steps_in_memory: 10
  loader:
#    start_indices:
#      list: [1, 121, 245, 369, 481, 605, 725, 849, 969, 1093, 1217, 1337, 1461, 1581, 1705, 1829]
    start_indices:
      times:
        - '1951-01-01T12:00:00'
        - '1956-01-01T00:00:00'
        - '1961-01-01T00:00:00'
        - '1963-06-01T00:00:00'
        - '1966-01-01T00:00:00'
        - '1971-01-01T00:00:00'
        - '1973-06-01T00:00:00'
        - '1976-01-01T00:00:00'
        - '1981-01-01T00:00:00'
        - '1983-06-01T00:00:00'
        - '1986-01-01T00:00:00'
        - '1991-01-01T00:00:00'
        - '1996-01-01T00:00:00'
        - '2001-01-01T00:00:00'
        - '2006-01-01T00:00:00'
        - '2009-01-01T00:00:00'
    dataset:
      data_path: /traindata/traindata
    num_data_workers: 0
  aggregator:
    log_histograms: true
    time_mean_reference_data: /statsdata/time-mean.nc
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: e3sm-v3-lr
  entity: rebassoo
train_loader:
  batch_size: 16
  num_data_workers: 1
  dataset:
    data_path: /traindata/traindata
#    subset:
#      start_time: '1952-01-01'
#      stop_time: '1956-12-31'
#    concat:
#      - data_path: /traindata/traindata
#        subset:
#          stop_time: '1952-12-31'
#      - data_path: /traindata/traindata
#        subset:
#          start_time: '1954-01-01'
#          stop_time: '1955-12-31'
validation_loader:
  batch_size: 32
  num_data_workers: 1
  dataset:
    data_path: /traindata/traindata
    subset:
      start_time: '1994-01-01'
      stop_time: '1995-12-31'
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_ensemble: 2
  n_forward_steps:
    outcomes:
      - steps: 1
        probability: 0.6
      - steps: 2
        probability: 0.2
      - steps: 4
        probability: 0.1
      - steps: 12
        probability: 0.05
      - steps: 20
        probability: 0.05
  optimize_last_step_only: true
  loss:
    type: EnsembleLoss
    weights:
      T_0: 0.5
      T_1: 0.5
      U_0: 0.5
      V_0: 0.5
      specific_total_water_0: 0.5
      specific_total_water_1: 0.25
      specific_total_water_2: 0.5
      surface_precipitation_rate: 0.5
      #h500: 10
      #TMP850: 5
      #Q2m: 0.5
      FLDS: 2
      surface_upward_longwave_flux: 5
      surface_upward_shortwave_flux: 2
      FSDS: 2
      top_of_atmos_upward_shortwave_flux: 2
      tendency_of_total_water_path_due_to_advection: 0.5
    kwargs:
      crps_weight: 0.9
      energy_score_weight: 0.1
#  input_masking:
#    mask_value: 0
#    fill_value: 0.0
#  parameter_init:
#    weights_path: /traindata/stochastic-era5-n384-e1c9-1step-rs1_best_ckpt.tar
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 384
          noise_embed_dim: 64
          noise_type: isotropic
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
      normalization:
        network:
          global_means_path: /statsdata/centering.nc
          global_stds_path: /statsdata/scaling-full-field.nc
        residual:
          global_means_path: /statsdata/centering.nc
          global_stds_path: /statsdata/scaling-residual.nc
      ocean:
        surface_temperature_name: TS
        ocean_fraction_name: OCNFRAC
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
#        moisture_budget_correction: precipitation
        force_positive_names:
        - specific_total_water_0
        - specific_total_water_1
        - specific_total_water_2
        - specific_total_water_3
        - specific_total_water_4
        - specific_total_water_5
        - specific_total_water_6
        - specific_total_water_7
        - surface_precipitation_rate
        - surface_upward_longwave_flux
        - FLUT
        - FLDS
        - FSDS
        - surface_upward_shortwave_flux
        - top_of_atmos_upward_shortwave_flux
      next_step_forcing_names:
      - SOLIN
      in_names:
      - LANDFRAC
      - OCNFRAC
      - ICEFRAC
      - PHIS
      - SOLIN
      - PS
      - TS
      - T_0
      - T_1
      - T_2
      - T_3
      - T_4
      - T_5
      - T_6
      - T_7
      - specific_total_water_0
      - specific_total_water_1
      - specific_total_water_2
      - specific_total_water_3
      - specific_total_water_4
      - specific_total_water_5
      - specific_total_water_6
      - specific_total_water_7
      - U_0
      - U_1
      - U_2
      - U_3
      - U_4
      - U_5
      - U_6
      - U_7
      - V_0
      - V_1
      - V_2
      - V_3
      - V_4
      - V_5
      - V_6
      - V_7
      out_names:
      - PS
      - TS
      - T_0
      - T_1
      - T_2
      - T_3
      - T_4
      - T_5
      - T_6
