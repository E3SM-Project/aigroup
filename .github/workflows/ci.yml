name: aigci

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/ci.yml
      - pyproject.toml
      - src/**
      - tests/**
  # Whatever a PR's base is: one of a stack targets the branch below it, not main,
  # and would otherwise be reviewed with no checks at all.
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - pyproject.toml
      - src/**
      - tests/**
  workflow_dispatch:

concurrency:
  group: aigci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        # base: Click only, where `xaig --help` must still work; numpy-backed
        # tests skip. full: every extra but torch, so the taig tests skip. taig: torch as
        # well, once -- the CPU build, since the default one brings CUDA along.
        tier: ["base", "full"]
        include:
          - tier: base
            sync: "--no-default-groups --group dev"
          - tier: full
            sync: ""
          - tier: taig
            python-version: "3.13"
            sync: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          show-progress: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml  # no uv.lock is committed
      # uv provides the interpreter, so the matrix version is the one actually
      # tested. Installing into a venv also avoids the runner's /usr, which is
      # externally managed and refuses --system.
      - name: Install
        run: |
          uv sync --python ${{ matrix.python-version }} ${{ matrix.sync }}
      - name: Install torch (CPU)
        if: matrix.tier == 'taig'
        run: |
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
      - name: Show interpreter
        run: .venv/bin/python -VV
      - name: Lint
        run: |
          .venv/bin/ruff check
          .venv/bin/ruff format --check
      - name: Test
        run: .venv/bin/pytest
      # The taig tests skip without torch, so a failed install would pass quietly.
      - name: Assert the taig tier has torch
        if: matrix.tier == 'taig'
        run: .venv/bin/python -c "import torch, xaig.taig.sae; print('torch', torch.__version__)"
      # That the base tier stays light, and that core stays pure, are tests now
      # (tests/test_purity.py), so they run locally as well as here. What only CI
      # can show is that the base tier really has no scientific stack installed.
      - name: Assert the base tier has no scientific stack
        if: matrix.tier == 'base'
        run: |
          .venv/bin/python - <<'PY'
          from importlib.util import find_spec
          present = [m for m in ("numpy", "xarray", "netCDF4", "torch", "matplotlib") if find_spec(m)]
          assert not present, f"base tier unexpectedly has {present}"
          print("base tier is light")
          PY
