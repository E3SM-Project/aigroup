name: aigci

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/ci.yml
      - pyproject.toml
      - src/**
      - tests/**
  pull_request:
    branches: ["main"]
    paths:
      - .github/workflows/ci.yml
      - pyproject.toml
      - src/**
      - tests/**
  workflow_dispatch:

concurrency:
  group: aigci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        # base: PyYAML + Click only, which is all caig may need; numpy-backed tests
        # skip. full: every extra the suite can exercise.
        tier: ["base", "full"]
        include:
          - tier: base
            extras: "dev"
          - tier: full
            extras: "dev,daig"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          show-progress: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv provides the interpreter, so the matrix version is the one actually
      # tested. Installing into a venv also avoids the runner's /usr, which is
      # externally managed and refuses --system.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[${{ matrix.extras }}]'
      - name: Show interpreter
        run: .venv/bin/python -VV
      - name: Lint
        run: .venv/bin/ruff check
      - name: Test
        run: .venv/bin/pytest
      # That the base tier stays light, and that core stays pure, are tests now
      # (tests/test_purity.py), so they run locally as well as here. What only CI
      # can show is that the base tier really has no scientific stack installed.
      - name: Assert the base tier has no scientific stack
        if: matrix.tier == 'base'
        run: |
          .venv/bin/python - <<'PY'
          from importlib.util import find_spec
          present = [m for m in ("numpy", "xarray", "netCDF4", "torch", "matplotlib") if find_spec(m)]
          assert not present, f"base tier unexpectedly has {present}"
          print("base tier is light")
          PY
