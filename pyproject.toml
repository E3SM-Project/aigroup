[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xaig"
dynamic = ["version"]
description = "Light, framework-agnostic tooling for E3SM AI campaigns"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "E3SM AI Group" }]
keywords = ["e3sm", "emulator", "climate", "machine-learning"]

dependencies = ["click>=8.1"]

# What a checkout gets and a wheel does not. uv installs the `dev` group by default, so
# `uv run pytest` and `uv run ruff check` work with no flags. The guide site:
# `uv run --group docs mkdocs build --strict`.
[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.5"]
# mkdocs 2 drops the plugin system this site is built on.
docs = ["mkdocs>=1.6,<2", "mkdocs-material[imaging]>=9.5"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
xaig = "xaig._cli:main"

[project.urls]
Homepage = "https://e3sm-project.github.io/aigroup"
Source = "https://github.com/E3SM-Project/aigroup"

[tool.hatch.version]
path = "src/xaig/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xaig"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# TID252 bans relative imports: the architecture tests read absolute ones.
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
