# Not a package: only what the guide site needs to build.
#   uv run --group docs mkdocs build --strict
[project]
name = "aigroup"
version = "0"
requires-python = ">=3.11"

[dependency-groups]
# mkdocs 2 drops the plugin system this site is built on.
docs = ["mkdocs>=1.6,<2", "mkdocs-material[imaging]>=9.5", "mkdocs-redirects>=1.2"]

[tool.uv]
package = false
